name: vulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      # The current release, tracking patches: the standard library's
      # fixes past the module's floor reach the check as they ship.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # The scan's JSON stream judged against the standing exceptions
      # (vulncheck.exceptions): an advisory reaching this module's
      # code fails unless an unexpired exception names it, and an
      # expired or stale exception fails on its own.
      - run: scripts/vulncheck.sh
