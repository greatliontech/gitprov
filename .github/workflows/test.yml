name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      # The current release, tracking patches: the standard library's
      # fixes past the module's floor reach the check as they ship.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go test -race -count=1 ./...
      # The suite pins rapid's seed for oracle determinism, which fixes
      # the property tests to one trajectory. This leg restores the
      # accumulating-coverage role: a per-run seed (the run id, so any
      # failure is replayable) explores fresh examples every run. The
      # seed and the check count travel as rapid's environment
      # defaults, which only a binary linking rapid reads, so every
      # package runs and a package without property tests is not
      # handed a flag it does not define.
      - name: property tests, varying seed
        run: go test -count=1 ./...
        env:
          RAPID_SEED: ${{ github.run_id }}
          RAPID_CHECKS: "500"
