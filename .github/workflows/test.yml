name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      # The current release, tracking patches: the standard library's
      # fixes past the module's floor reach the check as they ship.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # The suite pins rapid's seed for oracle determinism, which fixes
      # the property tests to one trajectory. This leg restores the
      # accumulating-coverage role: a per-run seed (the run id, so any
      # failure is replayable) explores fresh examples every run.
      - name: property tests, varying seed
        run: go test -count=1 -run 'TestSplitSignatureRoundTripsRawBytes|TestIdentityValidateAcceptsExactlyWellFormedPolicies|TestVerifyFailsClosedUnderCorruption' ./... -args -rapid.seed=${{ github.run_id }} -rapid.checks=500
