version: '3'

tasks:
  build:
    desc: Build all packages
    cmds:
      - go build ./...

  test:
    desc: Run tests
    cmds:
      - go test -race ./...

  lint:
    desc: Vet and gofmt check
    cmds:
      - go vet ./...
      - test -z "$(gofmt -l . | tee /dev/stderr)"

  tidy:
    desc: Tidy the module graph
    cmds:
      - go mod tidy

  vulncheck:
    desc: Scan the module graph for advisories, judged against vulncheck.exceptions
    cmds:
      - scripts/vulncheck.sh
